name: CI
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    # Runner GitHub-hosted (natif amd64, GNU coreutils inclus). Migre hors des
    # Mac self-hosted : supprime le goulot 1-PR-a-la-fois et la rustine PATH
    # coreutils (le BSD cut de macOS cassait dagger-for-github). Dagger tourne
    # nativement sur Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run CI pipeline
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.6"
          args: ci --source=.
