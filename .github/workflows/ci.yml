name: CI
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @usftt/shared
      - name: Typecheck
        run: npx turbo run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Check Drizzle migrations are in sync
        run: |
          cd packages/api
          npx drizzle-kit check
      - name: Build
        run: npm run build
