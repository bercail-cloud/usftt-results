name: Deploy
on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run CI pipeline
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.6"
          args: ci --source=.

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and push images
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.6"
          args: >-
            publish
            --source=.
            --github-token=env:GITHUB_TOKEN
            --git-sha=${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to VPS
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.6"
          args: >-
            deploy
            --source=.
            --ssh-key=env:VPS_SSH_KEY
            --vps-host=${{ vars.VPS_HOST }}
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
