name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run CI pipeline
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.6"
          args: ci --source=.

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and push images
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.6"
          args: >-
            publish
            --source=.
            --github-token=env:GITHUB_TOKEN
            --git-sha=${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Le VPS n'est joignable que par le tailnet : noeud Tailscale ephemere.
      # TS_AUTHKEY doit etre un secret de CE repo (le secret org est prive
      # uniquement, donc indisponible pour un repo public).
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Setup SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            "$VPS_USER@$VPS_HOST:/opt/usftt-results/"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' << 'ENDSSH'
          set -euo pipefail
          cd /opt/usftt-results
          docker compose pull
          docker compose up -d --wait --wait-timeout 60
          docker image prune -f
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
