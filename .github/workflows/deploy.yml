name: Deploy
on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: macos-self-hosted
    env:
      PATH: /opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/opt/gnu-sed/libexec/gnubin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v5
      - name: Run CI pipeline
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.6"
          args: ci --source=.

  build-and-push:
    needs: ci
    runs-on: macos-self-hosted
    env:
      PATH: /opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/opt/gnu-sed/libexec/gnubin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and push images
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.6"
          args: >-
            publish
            --source=.
            --github-token=env:GITHUB_TOKEN
            --git-sha=${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: macos-self-hosted
    steps:
      - uses: actions/checkout@v5

      # appleboy/scp-action et ssh-action sont des Docker container
      # actions, Linux-only. Sur runner macOS self-hosted on utilise
      # ssh/scp natifs (même pattern que btbcsp deploy.yml).
      - name: Setup SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose.yml \
            "$VPS_USER@$VPS_HOST:/opt/usftt-results/"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' << 'ENDSSH'
          set -euo pipefail
          cd /opt/usftt-results
          docker compose pull
          docker compose up -d --wait --wait-timeout 60
          docker image prune -f
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
