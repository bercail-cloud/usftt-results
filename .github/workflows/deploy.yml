name: Deploy Dokploy

# Le webhook GitHub -> Dokploy ne passe pas (Dokploy est tailnet-only) : la CI
# rejoint le tailnet via un noeud Tailscale ephemere et appelle l'API Dokploy
# `application.deploy` ; Dokploy fait le build-from-Git. Meme pattern qu'aero-3d.
#
# Secrets/vars a poser sur CE repo (les secrets org sont prives uniquement,
# indisponibles pour un repo public) :
#   - TS_AUTHKEY      (secret)   : clef Tailscale reusable + ephemere, tag:ci
#   - DOKPLOY_API_KEY (secret)   : cle API Dokploy
#   - DOKPLOY_URL     (variable) : http://100.122.209.88:3000

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-dokploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  USFTT_API_APP_ID: eP1lJQ0u5XTFx_f8FKLQB
  USFTT_WEB_APP_ID: NfXK_Go0rw6TAZrc-eyNW

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Trigger Dokploy deploy (api + web)
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_URL:-}" ] || [ -z "${DOKPLOY_API_KEY:-}" ]; then
            echo "::error::DOKPLOY_URL / DOKPLOY_API_KEY manquants."
            exit 1
          fi
          for app_id in "$USFTT_API_APP_ID" "$USFTT_WEB_APP_ID"; do
            echo "== deploy application ${app_id} =="
            curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
              -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"applicationId\":\"${app_id}\"}"
            echo
          done
