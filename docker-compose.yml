services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usftt}
      POSTGRES_USER: ${POSTGRES_USER:-usftt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usftt}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    image: ghcr.io/dcuenot/usftt-results-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-usftt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-usftt}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.usftt-api.rule=Host(`api.usftt-results.bercail.cloud`)
      - traefik.http.routers.usftt-api.entrypoints=websecure
      - traefik.http.routers.usftt-api.tls.certresolver=letsencrypt
      - traefik.http.services.usftt-api.loadbalancer.server.port=3000
      - traefik.docker.network=web

  web:
    image: ghcr.io/dcuenot/usftt-results-web:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.usftt-web.rule=Host(`usftt-results.bercail.cloud`)
      - traefik.http.routers.usftt-web.entrypoints=websecure
      - traefik.http.routers.usftt-web.tls.certresolver=letsencrypt
      - traefik.http.services.usftt-web.loadbalancer.server.port=80

networks:
  web:
    external: true
  internal:

volumes:
  pgdata:
